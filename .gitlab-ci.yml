spec:
  inputs:
    PIPELINE:
      description: "Pipeline mode: badges, full-matrix, or empty for a regular run"
      default: ""

---
# Routing only. Job definitions live in .gitlab/ci/, trigger definitions in
# .gitlab/ci/rules.yml.

stages:
  - validate
  - test
  - package
  - publish
  - release

default:
  interruptible: true

variables:
  PIPELINE: $[[ inputs.PIPELINE ]]
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && ($PIPELINE == null || $PIPELINE == "")'
      when: never
    - when: always

include:
  - local: .gitlab/ci/rules.yml
  - local: .gitlab/ci/validate.yml
  - local: .gitlab/ci/test.yml
  - local: .gitlab/ci/release.yml
  - local: .gitlab/ci/badges.yml
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
