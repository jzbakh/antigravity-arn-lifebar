stages:
  - validate
  - test
  - publish

cache:
  paths:
    - test/node_modules/

validate:
  image: node:22
  stage: validate
  script:
    - node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
    - node -c extension.js
    - |
      node -e "
        const p = require('./package.json');
        const required = ['name','displayName','description','version','publisher','license','engines','main','contributes','repository','icon'];
        const missing = required.filter(k => !p[k]);
        if (missing.length) { console.error('Missing manifest fields:', missing); process.exit(1); }
        console.log('All required fields present.');
      "
    - |
      node -e "
        const p = require('./package.json');
        if (p.dependencies && Object.keys(p.dependencies).length) {
          console.error('Runtime dependencies are forbidden:', p.dependencies);
          process.exit(1);
        }
        console.log('OK — zero runtime dependencies.');
      "

# --- INTEGRATION TESTS ---
integration-tests-linux:
  image: node:22
  stage: test
  before_script:
    - apt-get update && apt-get install -y libx11-xcb1 libxcb-dri3-0 libxtst6 libnss3 libxss1 libasound2 libgbm1 libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 xauth xvfb
  script:
    - cd test
    - npm ci
    - xvfb-run -a npm test

# --- PUBLISH ---
publish:
  image: node:22
  stage: publish
  needs:
    - validate
    - integration-tests-linux
  only:
    - tags
  script:
    - |
      PKG_VERSION=$(node -p "require('./package.json').version")
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
        echo "Version mismatch — package.json says $PKG_VERSION, release tag is $TAG_VERSION."
        exit 1
      fi
    - npx --yes @vscode/vsce package -o antigravity-arn-lifebar.vsix
    - npx --yes @vscode/vsce publish --packagePath antigravity-arn-lifebar.vsix -p "$VSCE_PUBLISH"
    - npx --yes ovsx publish antigravity-arn-lifebar.vsix -p "$OPEN_VSX"

# --- BADGES UPDATE (SCHEDULED) ---
update-badges:
  image: node:22
  stage: publish
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - apt-get update && apt-get install -y jq curl git
  script:
    - git clone --branch badges https://oauth2:${GITLAB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git /tmp/badges_repo
    - cd /tmp/badges_repo
    - mkdir -p .github/badges
    # --- VS Marketplace ---
    - |
      RESPONSE=$(curl -sS -X POST \
        -H "Content-Type: application/json" \
        -H "Accept: application/json;api-version=3.0-preview.1" \
        -d '{"flags":914,"filters":[{"criteria":[{"filterType":7,"value":"jzbakh.antigravity-arn-lifebar"}]}]}' \
        "https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery")
    - |
      VERSION=$(echo "$RESPONSE" | jq -r '(.results // [])[0] // {} | (.extensions // [])[0] // {} | (.versions // [])[0] // {} | (.version // "unknown")')
    - |
      DOWNLOADS=$(echo "$RESPONSE" | jq -r '(.results // [])[0] // {} | (.extensions // [])[0] // {} | (.statistics // []) | map(select(.statisticName == "install")) | (first // {value: 0}) | (.value // 0) | floor')
    - |
      if [ "$VERSION" != "unknown" ]; then
        DOWNLOADS_DISPLAY=$(if [ "$DOWNLOADS" -ge 1000000 ]; then awk -v n="$DOWNLOADS" 'BEGIN { printf "%.1fM", n/1000000 }'; elif [ "$DOWNLOADS" -ge 1000 ]; then awk -v n="$DOWNLOADS" 'BEGIN { printf "%.1fk", n/1000 }'; else echo "$DOWNLOADS"; fi)
        echo "{ \"schemaVersion\": 1, \"label\": \"VS Marketplace\", \"message\": \"v${VERSION}\", \"color\": \"blue\", \"namedLogo\": \"visualstudiocode\" }" > .github/badges/marketplace-version.json
        echo "{ \"schemaVersion\": 1, \"label\": \"Downloads\", \"message\": \"${DOWNLOADS_DISPLAY}\", \"color\": \"success\", \"namedLogo\": \"visualstudiocode\" }" > .github/badges/marketplace-downloads.json
      fi
    # --- Open VSX ---
    - |
      HTTP_CODE=$(curl -sS -o /tmp/vsx.json -w "%{http_code}" \
        "https://open-vsx.org/api/jzbakh/antigravity-arn-lifebar" || echo "000")
      if [ "$HTTP_CODE" = "200" ] && jq -e . /tmp/vsx.json > /dev/null 2>&1; then
        VSX_VERSION=$(jq -r '.version // "unknown"' /tmp/vsx.json)
        VSX_DOWNLOADS=$(jq -r '(.downloadCount // 0) | floor' /tmp/vsx.json)
        VSX_DOWNLOADS_DISPLAY=$(if [ "$VSX_DOWNLOADS" -ge 1000000 ]; then awk -v n="$VSX_DOWNLOADS" 'BEGIN { printf "%.1fM", n/1000000 }'; elif [ "$VSX_DOWNLOADS" -ge 1000 ]; then awk -v n="$VSX_DOWNLOADS" 'BEGIN { printf "%.1fk", n/1000 }'; else echo "$VSX_DOWNLOADS"; fi)
        echo "{ \"schemaVersion\": 1, \"label\": \"Open VSX\", \"message\": \"v${VSX_VERSION}\", \"color\": \"blue\" }" > .github/badges/openvsx-version.json
        echo "{ \"schemaVersion\": 1, \"label\": \"Downloads\", \"message\": \"${VSX_DOWNLOADS_DISPLAY}\", \"color\": \"success\" }" > .github/badges/openvsx-downloads.json
      else
        echo "Open VSX returned HTTP $HTTP_CODE — keeping previous cached badge values."
      fi
    # --- Commit & Push ---
    - |
      git config --global user.name "gitlab-ci[bot]"
      git config --global user.email "gitlab-ci[bot]@gitlab.com"
      git add .github/badges/
      if git diff --quiet --staged; then
        echo "Badges unchanged, nothing to commit."
      else
        git commit -m "chore(badges): refresh badge stats"
        git push origin badges
      fi

# --- SECURITY (SAST & SECRETS) ---
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
