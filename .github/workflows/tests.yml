name: Test Suite
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-manifest.js
      - run: node -c extension.js

  test:
    needs: validate
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: ./test
      - name: Run Tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
        working-directory: ./test
      - name: Run Tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm test
        working-directory: ./test
