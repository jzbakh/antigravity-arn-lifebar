update-badges:
  extends: .on-badges
  image: node:22
  stage: publish
  resource_group: badges
  needs: []
  before_script:
    - apt-get update && apt-get install -y jq curl git
  script:
    - 'if [ -z "$GITLAB_TOKEN" ]; then echo "CRITICAL ERROR: GITLAB_TOKEN is empty." && exit 1; fi'
    - 'git clone --branch badges-gitlab https://oauth2:${GITLAB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git /tmp/badges_repo'
    - cd /tmp/badges_repo
    - mkdir -p .gitlab/badges
    # --- VS Marketplace ---
    - |
      RESPONSE=$(curl -sS -X POST \
        -H "Content-Type: application/json" \
        -H "Accept: application/json;api-version=3.0-preview.1" \
        -d '{"flags":914,"filters":[{"criteria":[{"filterType":7,"value":"jzbakh.antigravity-arn-lifebar"}]}]}' \
        "https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery")
    - |
      VERSION=$(echo "$RESPONSE" | jq -r '(.results // [])[0] // {} | (.extensions // [])[0] // {} | (.versions // [])[0] // {} | (.version // "unknown")')
      DOWNLOADS=$(echo "$RESPONSE" | jq -r '(.results // [])[0] // {} | (.extensions // [])[0] // {} | (.statistics // []) | map(select(.statisticName == "install")) | (first // {value: 0}) | (.value // 0) | floor')
    - |
      if [ "$VERSION" != "unknown" ]; then
        DOWNLOADS_DISPLAY=$(if [ "$DOWNLOADS" -ge 1000000 ]; then awk -v n="$DOWNLOADS" 'BEGIN { printf "%.1fM", n/1000000 }'; elif [ "$DOWNLOADS" -ge 1000 ]; then awk -v n="$DOWNLOADS" 'BEGIN { printf "%.1fk", n/1000 }'; else echo "$DOWNLOADS"; fi)
        echo "{ \"schemaVersion\": 1, \"label\": \"VS Marketplace\", \"message\": \"v${VERSION}\", \"color\": \"blue\", \"namedLogo\": \"visualstudiocode\" }" > .gitlab/badges/marketplace-version.json
        echo "{ \"schemaVersion\": 1, \"label\": \"VS Marketplace Downloads\", \"message\": \"${DOWNLOADS_DISPLAY}\", \"color\": \"blueviolet\", \"namedLogo\": \"visualstudiocode\" }" > .gitlab/badges/marketplace-downloads.json
      fi
    # --- Open VSX ---
    - |
      OVSX_RESPONSE=$(curl -sS "https://open-vsx.org/api/jzbakh/antigravity-arn-lifebar")
      OVSX_VERSION=$(echo "$OVSX_RESPONSE" | jq -r '.version // "unknown"')
      OVSX_DOWNLOADS=$(echo "$OVSX_RESPONSE" | jq -r '.downloadCount // 0')
    - |
      if [ "$OVSX_VERSION" != "unknown" ] && [ "$OVSX_VERSION" != "null" ]; then
        OVSX_DL_DISP=$(if [ "$OVSX_DOWNLOADS" -ge 1000000 ]; then awk -v n="$OVSX_DOWNLOADS" 'BEGIN { printf "%.1fM", n/1000000 }'; elif [ "$OVSX_DOWNLOADS" -ge 1000 ]; then awk -v n="$OVSX_DOWNLOADS" 'BEGIN { printf "%.1fk", n/1000 }'; else echo "$OVSX_DOWNLOADS"; fi)
        echo "{ \"schemaVersion\": 1, \"label\": \"Open VSX\", \"message\": \"v${OVSX_VERSION}\", \"color\": \"blue\", \"namedLogo\": \"openvsx\" }" > .gitlab/badges/openvsx-version.json
        echo "{ \"schemaVersion\": 1, \"label\": \"Open VSX Downloads\", \"message\": \"${OVSX_DL_DISP}\", \"color\": \"blueviolet\", \"namedLogo\": \"openvsx\" }" > .gitlab/badges/openvsx-downloads.json
      fi
    # --- Commit & Push ---
    - |
      git config --global user.name "gitlab-ci[bot]"
      git config --global user.email "gitlab-ci[bot]@gitlab.com"
      git add .gitlab/badges/
      if git diff --quiet --staged; then
        echo "Badges unchanged, nothing to commit."
      else
        git commit -m "chore(badges): refresh badge stats"
        git push origin badges-gitlab
      fi
