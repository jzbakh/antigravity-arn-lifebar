# One VSIX per release tag: packaged once, published to each store by its own
# job, so a failed store can be retried alone, then attached to the release.

.release-node:
  image: node:22
  interruptible: false
  variables:
    VSCE: "@vscode/vsce@4.0.0"
    OVSX: "ovsx@1.2.0"

.release-glab:
  image: registry.gitlab.com/gitlab-org/cli:v1.120.0
  stage: release
  interruptible: false

package:
  extends:
    - .release-node
    - .on-release-build
  stage: package
  needs:
    - job: validate-manifest
      optional: true
    - job: integration-tests-linux
      optional: true
    - job: integration-tests-windows
      optional: true
  script:
    - VERSION=$(node -p "require('./package.json').version")
    - |
      if [ -n "$CI_COMMIT_TAG" ] && [ "$CI_COMMIT_TAG" != "v$VERSION" ]; then
        echo "Tag $CI_COMMIT_TAG does not match package.json version $VERSION."
        exit 1
      fi
    - npx --yes "$VSCE" ls | LC_ALL=C sort | diff -u scripts/vsix-files.txt -
    - npx --yes "$VSCE" package -o antigravity-arn-lifebar.vsix
    - sha256sum antigravity-arn-lifebar.vsix
    - echo "VERSION=$VERSION" > release.env
  artifacts:
    paths:
      - antigravity-arn-lifebar.vsix
    reports:
      dotenv: release.env
    expire_in: never

verify-tokens:
  extends:
    - .release-node
    - .on-release-build
  stage: package
  needs: []
  script:
    - npx --yes "$VSCE" verify-pat jzbakh -p "$VSCE_PUBLISH"
    - npx --yes "$OVSX" verify-pat jzbakh -p "$OPEN_VSX"

.publish:
  extends:
    - .release-node
    - .on-release
  stage: publish
  resource_group: release
  needs:
    - package
    - verify-tokens

publish:vs-marketplace:
  extends: .publish
  script:
    - npx --yes "$VSCE" publish --packagePath antigravity-arn-lifebar.vsix --skip-duplicate -p "$VSCE_PUBLISH"

publish:open-vsx:
  extends: .publish
  script:
    - npx --yes "$OVSX" publish --packagePath antigravity-arn-lifebar.vsix --skip-duplicate -p "$OPEN_VSX"

release:gitlab:
  extends:
    - .release-glab
    - .on-release
  needs:
    - publish:vs-marketplace
    - publish:open-vsx
  script:
    - sh scripts/release-notes.sh "${CI_COMMIT_TAG#v}" > release-notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: ./release-notes.md
    assets:
      links:
        - name: antigravity-arn-lifebar.vsix
          url: $CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/antigravity-arn-lifebar.vsix?job=package
          filepath: /antigravity-arn-lifebar.vsix
          link_type: package
        - name: Visual Studio Marketplace
          url: https://marketplace.visualstudio.com/items?itemName=jzbakh.antigravity-arn-lifebar
          link_type: other
        - name: Open VSX
          url: https://open-vsx.org/extension/jzbakh/antigravity-arn-lifebar
          link_type: other

release:dry-run:
  extends:
    - .release-glab
    - .on-release-dry-run
  needs:
    - package
    - verify-tokens
  script:
    - sh scripts/release-notes.sh "$VERSION"
    - sha256sum antigravity-arn-lifebar.vsix
    - echo "Dry run of v$VERSION complete; nothing was published."

backfill:fetch:
  extends:
    - .release-node
    - .on-release-backfill
  stage: package
  needs: []
  script:
    - node scripts/fetch-published-vsix.mjs "$TAG"
  artifacts:
    paths:
      - antigravity-arn-lifebar.vsix
    reports:
      dotenv: release.env
    expire_in: never

# The release keyword only takes a literal released_at, so the original date
# goes through the CLI.
release:backfill:
  extends:
    - .release-glab
    - .on-release-backfill
  needs:
    - backfill:fetch
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - sh scripts/release-notes.sh "${TAG#v}" > release-notes.md
    - |
      glab release create "$TAG" --no-update \
        --name "$TAG" \
        --notes-file release-notes.md \
        --released-at "$RELEASED_AT" \
        --assets-links "[
          {\"name\": \"antigravity-arn-lifebar.vsix\", \"url\": \"$CI_PROJECT_URL/-/jobs/$FETCH_JOB_ID/artifacts/raw/antigravity-arn-lifebar.vsix\", \"direct_asset_path\": \"/antigravity-arn-lifebar.vsix\", \"link_type\": \"package\"},
          {\"name\": \"Visual Studio Marketplace\", \"url\": \"https://marketplace.visualstudio.com/items?itemName=jzbakh.antigravity-arn-lifebar\", \"link_type\": \"other\"},
          {\"name\": \"Open VSX\", \"url\": \"https://open-vsx.org/extension/jzbakh/antigravity-arn-lifebar\", \"link_type\": \"other\"}
        ]"
