publish:
  extends: .on-release
  image: node:22
  stage: publish
  interruptible: false
  needs:
    - validate-manifest
    - integration-tests-linux
  script:
    - |
      PKG_VERSION=$(node -p "require('./package.json').version")
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
        echo "Version mismatch - package.json says $PKG_VERSION, release tag is $TAG_VERSION."
        exit 1
      fi
    - npx --yes @vscode/vsce package -o antigravity-arn-lifebar.vsix
    - npx --yes @vscode/vsce publish --packagePath antigravity-arn-lifebar.vsix -p "$VSCE_PUBLISH"
    - npx --yes ovsx publish antigravity-arn-lifebar.vsix -p "$OPEN_VSX"
  artifacts:
    paths:
      - antigravity-arn-lifebar.vsix
    expire_in: never

gitlab-release:
  extends: .on-release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: publish
  interruptible: false
  needs:
    - publish
  script:
    - TAG_VERSION="${CI_COMMIT_TAG#v}"
    - echo "Extracting CHANGELOG for version $TAG_VERSION"
    - echo "# What's new in v${TAG_VERSION} ?" > release_notes.md
    - echo "" >> release_notes.md
    - awk -v ver="[${TAG_VERSION}]" '/^## \[/ { if (p) exit; if (index($2, ver) == 1) { p=1; next } } p { print }' CHANGELOG.md >> release_notes.md
    - |
      release-cli create --name "Release $CI_COMMIT_TAG" \
        --tag-name "$CI_COMMIT_TAG" \
        --description "$(cat release_notes.md)" \
        --assets-link "{\"name\":\"Extension Binary (.vsix)\",\"url\":\"${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/antigravity-arn-lifebar.vsix?job=publish\",\"filepath\":\"/antigravity-arn-lifebar.vsix\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"Download on VS Marketplace\",\"url\":\"https://marketplace.visualstudio.com/items?itemName=jzbakh.antigravity-arn-lifebar\",\"link_type\":\"other\"}" \
        --assets-link "{\"name\":\"Download on Open VSX\",\"url\":\"https://open-vsx.org/extension/jzbakh/antigravity-arn-lifebar\",\"link_type\":\"other\"}"
