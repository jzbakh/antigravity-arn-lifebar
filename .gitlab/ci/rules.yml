# Trigger definitions. Every job in this project extends exactly one of these,
# so the answer to "when does this run?" lives in a single file.
#
# $PIPELINE names a single-purpose pipeline and is set by pipeline schedules
# or by a manual run. Ordinary branch and tag pipelines leave it empty.
#
#   (unset)   branch push, tag, or manual run
#   badges    marketplace counters only
#   full-matrix   full cross-platform suite

.on-any-commit:
  rules:
    - if: '$PIPELINE == "full-matrix"'
    - if: '$PIPELINE'
      when: never
    - when: on_success

.on-code:
  rules:
    - if: '$PIPELINE == "full-matrix"'
    - if: '$PIPELINE'
      when: never
    - if: '$CI_COMMIT_TAG'
    - changes:
        - extension.js
        - package.json
        - scripts/**/*
        - test/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/**/*

.on-full-matrix:
  rules:
    - if: '$PIPELINE == "full-matrix"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

.on-release:
  rules:
    - if: '$PIPELINE'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

.on-badges:
  rules:
    - if: '$PIPELINE == "badges"'
    - if: '$PIPELINE'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
